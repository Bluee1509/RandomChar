spring.application.name=RandomChar

# Database Config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/random_char_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Admin Account
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# JPA & Hibernate
logging.level.org.hibernate.orm.connections.pooling=WARN
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Liquibase Config
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


app.cookie.secure=${APP_COOKIE_SECURE:false}

app.jwt.secret=${JWT_SECRET:RandomCharSuperSecretKeyForJwtToken2024!@#}


# Brevo API
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:RANDOM CHAR}