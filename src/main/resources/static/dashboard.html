<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quản Lý Diễn Viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-card: #171a21;
            --bg-card-hover: #1f232d;
            --accent: #ff7700;
            --accent-hover: #ff8c1a;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border-color: #272c38;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navbar */
        header {
            background-color: #12151b;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background-color: #212631;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: var(--border-color);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Container Layout 2 Cột */
        .container {
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 60px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Card Khung Chứa */
        .panel-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }

        .counter-badge {
            background: #252b38;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 119, 0, 0.3);
        }

        /* Form Nhập Liệu */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #0e1015;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 119, 0, 0.2);
        }

        /* Ẩn mũi tên tăng giảm số trên Chrome, Safari, Edge, Opera */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Ẩn mũi tên tăng giảm số trên Firefox */
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Live Preview ảnh */
        .preview-box {
            width: 100%;
            height: 180px;
            background-color: #0e1015;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 18px;
            position: relative;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-placeholder {
            color: var(--text-sub);
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #ff5500 100%);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 119, 0, 0.35);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, #ff6a00 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 119, 0, 0.5);
        }

        /* Bảng Danh Sách */
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #12151c;
        }

        th {
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: var(--bg-card-hover);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Ảnh đại diện nhỏ trong bảng */
        .thumb-cell {
            width: 50px;
            height: 65px;
            border-radius: 6px;
            overflow: hidden;
            background: #090a0d;
            border: 1px solid var(--border-color);
        }

        .thumb-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .actor-title {
            font-weight: 600;
            color: var(--text-main);
        }

        .age-tag {
            background: #20242e;
            color: #d1d5db;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Nút Xóa */
        .btn-del {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-del:hover {
            background-color: var(--danger);
            color: #fff;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
        }

        .empty-row {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Header Navbar -->
<header>
    <div class="logo">
        RANDOM<span>CHAR</span>
    </div>
    <a href="index.html" class="nav-btn">
        <span>🌐</span> Xem Trang Chủ
    </a>
</header>

<div class="container">
    <!-- Cột Trái: Form Thêm Diễn Viên -->
    <div class="panel-card">
        <h2 class="panel-title">Thêm Diễn Viên Mới</h2>

        <form id="add-actor-form" onsubmit="saveActor(event)">
            <div class="form-group">
                <label for="name">Tên diễn viên</label>
                <input type="text" id="name" required placeholder="Ví dụ: Sora Aoi">
            </div>

            <div class="form-group">
                <label for="age">Tuổi</label>
                <input type="number" id="age" required min="1" max="120" placeholder="Ví dụ: 25">
            </div>

            <div class="form-group">
                <label for="imageUrl">Link ảnh đại diện (URL)</label>
                <input type="text" id="imageUrl" required placeholder="Dán link https://..." oninput="updatePreview(this.value)">
            </div>

            <!-- Ô xem trước ảnh -->
            <div class="preview-box" id="preview-box">
                <img id="preview-img" src="" alt="Preview">
                <span class="preview-placeholder" id="preview-text">🖼️ Xem trước hình ảnh tại đây</span>
            </div>

            <button type="submit" class="btn-submit">➕ Lưu Vào Database</button>
        </form>
    </div>

    <!-- Cột Phải: Bảng Danh Sách Diễn Viên -->
    <div class="panel-card">
        <div class="panel-title">
            <span>Danh Sách Quản Lý</span>
            <span class="counter-badge" id="total-badge">0 Diễn viên</span>
        </div>

        <div class="table-responsive">
            <table>

                <tbody id="table-body">
                <!-- Dữ liệu đổ từ API -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/actors';

    // 1. Tải danh sách diễn viên vào bảng
    async function loadTable() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById('table-body');
            const badge = document.getElementById('total-badge');

            tbody.innerHTML = '';
            badge.innerText = `${data.length} Diễn viên`;

            if (!data || data.length === 0) {
                tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-row">
                                Hiện chưa có diễn viên nào trong cơ sở dữ liệu. Hãy thêm ở form bên trái!
                            </td>
                        </tr>
                    `;
                return;
            }

            const fallbackImg = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';

            data.forEach(actor => {
                tbody.innerHTML += `
                        <tr>
                            <td style="color: var(--text-sub); font-weight: 600;">#${actor.id}</td>
                            <td>
                                <div class="thumb-cell">
                                    <img src="${actor.imageUrl || fallbackImg}"
                                         alt="${actor.name}"
                                         onerror="this.src='${fallbackImg}'">
                                </div>
                            </td>
                            <td>
                                <div class="actor-title">${actor.name}</div>
                            </td>
                            <td>
                                <span class="age-tag">${actor.age} tuổi</span>
                            </td>
                            <td style="text-align: center;">
                                <button class="btn-del" onclick="deleteActor(${actor.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
            });
        } catch (err) {
            console.error("Lỗi khi tải bảng:", err);
        }
    }

    // 2. Cập nhật ảnh Preview khi gõ/dán link
    function updatePreview(url) {
        const img = document.getElementById('preview-img');
        const text = document.getElementById('preview-text');

        if (url && url.trim().length > 5) {
            img.src = url.trim();
            img.style.display = 'block';
            text.style.display = 'none';

            img.onerror = () => {
                img.style.display = 'none';
                text.style.display = 'block';
                text.innerText = '❌ Link ảnh không hợp lệ!';
            };
            img.onload = () => {
                img.style.display = 'block';
                text.style.display = 'none';
            };
        } else {
            img.style.display = 'none';
            text.style.display = 'block';
            text.innerText = '🖼 Xem trước hình ảnh tại đây';
        }
    }

    // 3. Thêm mới diễn viên qua API POST
    async function saveActor(e) {
        e.preventDefault();
        const actor = {
            name: document.getElementById('name').value.trim(),
            age: parseInt(document.getElementById('age').value),
            imageUrl: document.getElementById('imageUrl').value.trim()
        };

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(actor)
            });

            if (res.ok) {
                document.getElementById('add-actor-form').reset();
                updatePreview('');
                loadTable();
            } else {
                alert('Lỗi khi thêm diễn viên vào hệ thống!');
            }
        } catch (err) {
            console.error("Lỗi kết nối:", err);
            alert('Không thể kết nối đến máy chủ!');
        }
    }

    // 4. Xóa diễn viên qua API DELETE
    async function deleteActor(id) {
        if (confirm(`Bạn có chắc chắn muốn xóa diễn viên mang ID #${id}?`)) {
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadTable();
                } else {
                    alert('Không thể xóa diễn viên này!');
                }
            } catch (err) {
                console.error("Lỗi xóa:", err);
            }
        }
    }

    loadTable();
</script>
</body>
</html>
