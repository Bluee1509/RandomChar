<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quản Lý Diễn Viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-card: #171a21;
            --bg-card-hover: #1f232d;
            --accent: #ff7700;
            --accent-hover: #ff8c1a;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border-color: #272c38;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --edit: #3b82f6;
            --edit-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #12151b;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background-color: #212631;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: var(--border-color);
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 60px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }

        .counter-badge {
            background: #252b38;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 119, 0, 0.3);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input[type="text"], input[type="number"], input[type="url"] {
            width: 100%;
            padding: 11px 13px;
            background-color: #0e1015;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 119, 0, 0.2);
        }

        /* XÓA BỎ MŨI TÊN TĂNG GIẢM TRÊN CHROME, SAFARI, EDGE, OPERA */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* XÓA BỎ MŨI TÊN TĂNG GIẢM TRÊN FIREFOX */
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .calculated-age-hint {
            font-size: 12px;
            color: var(--accent);
            margin-top: 5px;
            font-weight: 600;
            display: block;
            min-height: 16px;
        }

        .preview-box {
            width: 100%;
            height: 160px;
            background-color: #0e1015;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-placeholder {
            color: var(--text-sub);
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }

        .btn-actions-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #ff5500 100%);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 119, 0, 0.35);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, #ff6a00 100%);
            transform: translateY(-1px);
        }

        .btn-cancel {
            width: 100%;
            background-color: #242933;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background-color: #2f3542;
            color: #fff;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #12151c;
        }

        th {
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th:nth-child(2), td:nth-child(2),
        th:nth-child(4), td:nth-child(4) {
            text-align: center;
        }

        tbody tr:hover {
            background-color: var(--bg-card-hover);
        }

        .thumb-cell {
            width: 48px;
            height: 62px;
            border-radius: 6px;
            overflow: hidden;
            background: #090a0d;
            border: 1px solid var(--border-color);
            margin: 0 auto;
        }

        .thumb-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .actor-title {
            font-weight: 600;
            color: var(--text-main);
        }

        .birth-tag {
            background: #20242e;
            color: #d1d5db;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .code-pill {
            background: #1c222d;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 2px;
            display: inline-block;
            border: 1px solid rgba(255, 119, 0, 0.2);
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-edit {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--edit);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-edit:hover {
            background-color: var(--edit);
            color: #fff;
        }

        .btn-del {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-del:hover {
            background-color: var(--danger);
            color: #fff;
        }

        .empty-row {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 14px;
        }

        @media (max-width: 640px) {
            header { padding: 12px 16px; }
            .container { padding: 15px 10px; gap: 20px; }
            .panel-card { padding: 16px 12px; }
            .preview-box { height: 130px; }
            th, td { padding: 10px 6px; font-size: 13px; }
            .action-btns { flex-direction: column; gap: 6px; }
            .btn-edit, .btn-del { padding: 6px 8px; font-size: 12px; width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        RANDOM<span>CHAR</span>
    </div>
    <a href="/" class="nav-btn">
        <span>🌐</span> Xem Trang Chủ
    </a>
</header>

<div class="container">
    <!-- Cột Trái: Form Thêm / Sửa -->
    <div class="panel-card">
        <h2 class="panel-title" id="form-heading">Thêm Diễn Viên Mới</h2>

        <form id="actor-form" onsubmit="saveActor(event)">
            <input type="hidden" id="actor-id">

            <div class="form-group">
                <label for="name">Tên diễn viên</label>
                <input type="text" id="name" required placeholder="Ví dụ: Sora Aoi">
            </div>

            <div class="form-group">
                <label for="birthYear">Năm sinh</label>
                <input type="number" id="birthYear" required min="1900" max="2030" placeholder="Ví dụ: 1999"
                       oninput="calculateAgePreview(this.value)"
                       onwheel="event.preventDefault()">
                <span class="calculated-age-hint" id="age-preview"></span>
            </div>

            <div class="form-group">
                <label for="imageUrl">Link ảnh đại diện (URL)</label>
                <input type="url" id="imageUrl" required placeholder="https://..." oninput="updatePreview(this.value)">
            </div>

            <div class="preview-box" id="preview-box">
                <img id="preview-img" src="" alt="Preview">
                <span class="preview-placeholder" id="preview-text">🖼️ Xem trước hình ảnh tại đây</span>
            </div>

            <div class="form-group">
                <label for="famousCode">Code nổi bật (cách nhau bởi dấu phẩy)</label>
                <input type="text" id="famousCode" placeholder="Ví dụ: SSIS-888, MIDE-123">
            </div>

            <div class="form-group">
                <label for="webUrl">Link Website / Profile</label>
                <input type="url" id="webUrl" placeholder="https://...">
            </div>

            <div class="btn-actions-group">
                <button type="submit" class="btn-submit" id="btn-submit-form">➕ Lưu Vào Database</button>
                <button type="button" class="btn-cancel" id="btn-cancel-edit" onclick="resetToCreateMode()">❌ Hủy Chỉnh Sửa</button>
            </div>
        </form>
    </div>

    <!-- Cột Phải: Bảng Danh Sách -->
    <div class="panel-card">
        <div class="panel-title">
            <span>Danh Sách Quản Lý</span>
            <span class="counter-badge" id="total-badge">0 Diễn viên</span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th style="width: 45px; text-align: center;">#</th>
                    <th style="width: 65px; text-align: center;">Ảnh</th>
                    <th>Tên & Code</th>
                    <th style="width: 130px; text-align: center;">Năm sinh (Tuổi)</th>
                    <th style="width: 140px; text-align: center;">Thao tác</th>
                </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/actors';
    let actorsData = [];
    const currentYear = new Date().getFullYear();

    function calculateAgePreview(yearVal) {
        const hint = document.getElementById('age-preview');
        const year = parseInt(yearVal);
        if (year && year > 1900 && year <= currentYear) {
            hint.innerText = `💡 Tương đương: ${currentYear - year} tuổi`;
        } else {
            hint.innerText = '';
        }
    }

    async function loadTable() {
        try {
            const res = await fetch(API_URL);
            actorsData = await res.json();

            // SẮP XẾP CỐ ĐỊNH THEO ID ĐỂ KHÔNG BỊ NHẢY THỨ TỰ KHI SỬA
            actorsData.sort((a, b) => a.id - b.id);

            const tbody = document.getElementById('table-body');
            const badge = document.getElementById('total-badge');

            tbody.innerHTML = '';
            badge.innerText = `${actorsData.length} Diễn viên`;

            if (!actorsData || actorsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Chưa có dữ liệu diễn viên nào.</td></tr>`;
                return;
            }

            const fallbackImg = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';

            actorsData.forEach((actor, index) => {
                const birth = actor.birthYear || '---';
                const calculatedAge = actor.age != null ? `${actor.age} tuổi` : (actor.birthYear ? `${currentYear - actor.birthYear} tuổi` : '---');

                let codesHtml = '';
                if (actor.famousCode) {
                    const codes = actor.famousCode.split(',').map(c => c.trim()).filter(c => c.length > 0);
                    codesHtml = codes.slice(0, 3).map(c => `<span class="code-pill">${c}</span>`).join('');
                    if (codes.length > 3) codesHtml += `<span style="font-size:11px;color:var(--text-sub)">+${codes.length - 3}</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td style="color: var(--text-sub); font-weight: 600; text-align: center;">#${index + 1}</td>
                        <td>
                            <div class="thumb-cell">
                                <img src="${actor.imageUrl || fallbackImg}" alt="${actor.name}" onerror="this.src='${fallbackImg}'">
                            </div>
                        </td>
                        <td>
                            <div class="actor-title">${actor.name}</div>
                            <div>${codesHtml}</div>
                        </td>
                        <td style="text-align: center;">
                            <span class="birth-tag">${birth} (${calculatedAge})</span>
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="startEdit(${actor.id})">✏️ Sửa</button>
                                <button class="btn-del" onclick="deleteActor(${actor.id})">🗑 Xóa</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Lỗi khi tải bảng:", err);
        }
    }

    function updatePreview(url) {
        const img = document.getElementById('preview-img');
        const text = document.getElementById('preview-text');

        if (url && url.trim().length > 5) {
            img.src = url.trim();
            img.style.display = 'block';
            text.style.display = 'none';

            img.onerror = () => {
                img.style.display = 'none';
                text.style.display = 'block';
                text.innerText = '❌ Link ảnh không hợp lệ!';
            };
            img.onload = () => {
                img.style.display = 'block';
                text.style.display = 'none';
            };
        } else {
            img.style.display = 'none';
            text.style.display = 'block';
            text.innerText = '🖼 Xem trước hình ảnh tại đây';
        }
    }

    function startEdit(id) {
        const actor = actorsData.find(a => a.id === id);
        if (!actor) return;

        document.getElementById('actor-id').value = actor.id;
        document.getElementById('name').value = actor.name;
        document.getElementById('birthYear').value = actor.birthYear || '';
        document.getElementById('imageUrl').value = actor.imageUrl || '';
        document.getElementById('famousCode').value = actor.famousCode || '';
        document.getElementById('webUrl').value = actor.webUrl || '';

        calculateAgePreview(actor.birthYear || '');
        document.getElementById('form-heading').innerText = 'Chỉnh Sửa Diễn Viên';
        document.getElementById('btn-submit-form').innerText = '💾 Cập Nhật Thay Đổi';
        document.getElementById('btn-cancel-edit').style.display = 'block';

        updatePreview(actor.imageUrl || '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetToCreateMode() {
        document.getElementById('actor-id').value = '';
        document.getElementById('actor-form').reset();
        document.getElementById('age-preview').innerText = '';
        document.getElementById('form-heading').innerText = 'Thêm Diễn Viên Mới';
        document.getElementById('btn-submit-form').innerText = '➕ Lưu Vào Database';
        document.getElementById('btn-cancel-edit').style.display = 'none';
        updatePreview('');
    }

    async function saveActor(e) {
        e.preventDefault();
        const id = document.getElementById('actor-id').value;
        const actor = {
            name: document.getElementById('name').value.trim(),
            birthYear: parseInt(document.getElementById('birthYear').value),
            imageUrl: document.getElementById('imageUrl').value.trim(),
            famousCode: document.getElementById('famousCode').value.trim(),
            webUrl: document.getElementById('webUrl').value.trim()
        };

        const isEditing = Boolean(id);
        const requestUrl = isEditing ? `${API_URL}/${id}` : API_URL;
        const requestMethod = isEditing ? 'PATCH' : 'POST';

        try {
            const res = await fetch(requestUrl, {
                method: requestMethod,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(actor)
            });

            if (res.ok) {
                resetToCreateMode();
                loadTable();
            } else {
                alert(isEditing ? 'Lỗi khi cập nhật diễn viên!' : 'Lỗi khi thêm diễn viên vào hệ thống!');
            }
        } catch (err) {
            console.error("Lỗi kết nối:", err);
            alert('Không thể kết nối đến máy chủ!');
        }
    }

    async function deleteActor(id) {
        if (confirm(`Bạn có chắc chắn muốn xóa diễn viên này?`)) {
            try {
                const res = await fetch(`${API_URL}/${id}`, {method: 'DELETE'});
                if (res.ok) {
                    if (document.getElementById('actor-id').value == id) {
                        resetToCreateMode();
                    }
                    loadTable();
                } else {
                    alert('Không thể xóa diễn viên này!');
                }
            } catch (err) {
                console.error("Lỗi xóa:", err);
            }
        }
    }

    loadTable();
</script>
</body>
</html>
