<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Character - Vòng Quay May Mắn</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --bg-input: #ffffff;
            --accent: #ff3366;
            --accent-hover: #ff5c85;
            --accent-glow: rgba(255, 51, 102, 0.6);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --text-input: #000000;
            --border-color: #222222;
            --danger: #ef4444;

            --card-w: clamp(140px, min(16vw, calc((100dvh - 280px) / 1.45)), 380px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden !important;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background-color: #000000;
            border-bottom: 1px solid #222;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            flex-shrink: 0;
            height: 65px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #fff;
            border: 1.5px solid var(--accent);
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .logo:hover {
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo span {
            color: var(--accent);
            font-size: 26px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-dropdown-container {
            position: relative;
            display: none;
            width: fit-content; /* Ôm khít nội dung */
        }
        /* Nút Đăng nhập cho Khách */
        .btn-login-nav {
            background: var(--accent);
            color: #fff;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: none; /* Mặc định ẩn, JS sẽ bật lên nếu chưa login */
        }
        .btn-login-nav:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .user-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141414;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-btn:hover {
            border-color: var(--accent);
            background: #1f1f1f;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #141414; /* Hoặc #171a21 nếu ở dashboard */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: max-content; /* Tự động co giãn theo nội dung */
            min-width: 140px;   /* Độ rộng tối thiểu cho đẹp */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.2s ease; z-index: 1000;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background: #1f1f1f;
        }

        .dropdown-item.danger {
            color: var(--danger);
            border-top: 1px solid var(--border-color);
        }

        .dropdown-item.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .search-box {
            position: relative;
            width: 240px;
            transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .search-box:focus-within {
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            background: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 2px;
            color: var(--text-input);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            box-shadow: 0 0 0 2px var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #555;
            pointer-events: none;
        }

        .btn-icon {
            background: transparent;
            color: #fff;
            border: none;
            border-radius: 4px;
            width: 34px;
            height: 34px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            color: var(--accent);
        }

        /* CONTAINER CHÍNH */
        .container {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 0;
        }

        .carousel-wrapper {
            position: relative;
            width: 100%;
            background: radial-gradient(circle at center, rgba(255, 51, 102, 0.05) 0%, transparent 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
        }

        .carousel-container {
            display: flex;
            gap: clamp(16px, 1.5vw, 36px);
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 30px 20px;
            width: 100%;
            justify-content: safe center;
            align-items: center;
            height: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #1a1e26;
        }

        .carousel-container::-webkit-scrollbar {
            height: 6px;
        }

        .carousel-container::-webkit-scrollbar-track {
            background: #111;
        }

        .carousel-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        body.is-rolling .carousel-container {
            scrollbar-color: transparent transparent !important;
        }

        body.is-rolling .carousel-container::-webkit-scrollbar-thumb,
        body.is-rolling .carousel-container::-webkit-scrollbar-track {
            background: transparent !important;
        }

        body.is-rolling .nav-arrow {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        body.is-rolling .card {
            pointer-events: none;
            transition: none !important;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: none;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 18px;
            transition: all 0.25s ease;
        }

        .nav-arrow:hover {
            background: var(--accent);
        }

        .nav-arrow.prev {
            left: -10px;
        }

        .nav-arrow.next {
            right: -10px;
        }

        .card {
            flex: 0 0 var(--card-w);
            background-color: var(--bg-card);
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
            z-index: 3;
        }

        .card-thumbnail {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        .card-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .card-info {
            padding: 10px;
            text-align: center;
            background: #111;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-role {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .card.active-roll {
            border-color: var(--accent) !important;
            transform: scale(1.06) !important;
            box-shadow: 0 0 20px var(--accent-glow) !important;
            z-index: 4 !important;
        }

        .card.winner {
            border-color: var(--accent) !important;
            transform: scale(1.1) !important;
            box-shadow: 0 0 30px var(--accent-glow) !important;
            z-index: 5 !important;
            animation: pulseGlow 1.2s infinite alternate, winnerShake 0.5s ease-in-out 3;
        }

        .card.winner::before {
            content: '⭐ WINNER ⭐';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 2px;
            z-index: 10;
            white-space: nowrap;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px var(--accent-glow);
            }
            100% {
                box-shadow: 0 0 35px var(--accent);
            }
        }

        @keyframes winnerShake {
            0%, 100% {
                transform: scale(1.1) rotate(0deg);
            }
            25% {
                transform: scale(1.12) rotate(-2deg);
            }
            75% {
                transform: scale(1.12) rotate(2deg);
            }
        }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: 10px;
        }

        .btn-random {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 45px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-random:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-random:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-sub);
            min-height: 20px;
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            position: relative;
            transform: translateY(10px) scale(0.98);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: #111;
            border: none;
            color: #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--accent);
            color: #fff;
        }

        .modal-body {
            display: flex;
            gap: 20px;
            padding: 24px;
            overflow-y: auto;
            max-height: calc(90vh - 60px);
        }

        .modal-avatar {
            width: 140px;
            height: 190px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .modal-name {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .info-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 14px;
        }

        .info-label {
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            width: 95px;
            flex-shrink: 0;
        }

        .info-val {
            color: #ddd;
            font-weight: 600;
        }

        .codes-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .code-tag {
            background: #111;
            color: var(--accent);
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 12px;
        }

        .modal-footer {
            background-color: #000;
            padding: 16px 24px;
            border-top: 1px solid #222;
            display: flex;
            justify-content: flex-end;
        }

        .btn-visit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-visit:hover {
            background: var(--accent-hover);
        }

        /* History List */
        .history-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #222;
        }

        .history-item img {
            width: 40px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
        }

        .history-info {
            flex: 1;
        }

        .history-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
        }

        .history-time {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* SKELETON & CONFETTI */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .skeleton-card {
            flex: 0 0 var(--card-w);
            background-color: var(--bg-card);
            border: 1px solid #222;
            border-radius: 4px;
            overflow: hidden;
        }

        .skeleton-thumbnail {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background: linear-gradient(90deg, #111 0%, #222 50%, #111 100%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s infinite;
        }

        .skeleton-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #111;
        }

        .skeleton-line {
            height: 12px;
            border-radius: 4px;
            background: linear-gradient(90deg, #111 0%, #222 50%, #111 100%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s infinite;
        }

        .skeleton-line.name {
            width: 75%;
            height: 14px;
        }

        .skeleton-line.role {
            width: 45%;
            height: 10px;
        }

        @keyframes skeletonShimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                padding: 0 10px;
                height: 55px;
            }

            .logo {
                font-size: 16px;
                padding: 4px 8px;
                flex-shrink: 0;
            }

            .logo span {
                font-size: 18px;
            }

            .header-right {
                flex: 1;
                justify-content: flex-end;
                gap: 6px;
                min-width: 0;
                margin-left: 8px;
            }

            .search-box {
                width: 100%;
                max-width: 130px;
                min-width: 50px;
            }

            .search-box input {
                padding: 6px 8px 6px 26px;
                font-size: 12px;
            }

            .search-icon {
                left: 8px;
                font-size: 12px;
            }

            .btn-icon {
                width: 28px;
                height: 28px;
                font-size: 14px;
                flex-shrink: 0;
            }

            .user-btn {
                padding: 4px 8px;
            }

            .user-btn span.username {
                display: none;
            }

            /* Ẩn tên trên mobile, chỉ hiện avatar */
        }

        @media (max-width: 640px) {
            .container {
                padding: 5px 10px;
                gap: 10px;
            }

            :root {
                --card-w: clamp(105px, 32vw, 150px);
            }

            .nav-arrow {
                display: none !important;
            }

            .carousel-container {
                padding: 10px 10px;
                gap: 12px;
            }

            .action-area {
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
                gap: 8px;
            }

            .btn-random {
                padding: 10px 30px;
                font-size: 15px;
            }

            .status-text {
                font-size: 12px;
            }

            .modal-body {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px 16px;
            }

            .modal-avatar {
                width: 120px;
                height: 160px;
            }
        }
        .modal-name,
        .info-val,
        .code-tag,
        .card-name {
            user-select: text !important;
            -webkit-user-select: text !important;
            cursor: text;
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
    <div class="logo" onclick="location.reload()">RANDOM<span>CHAR</span></div>

    <div class="header-right">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Tìm kiếm diễn viên..." oninput="handleSearch(this.value)">
        </div>

        <!-- NÚT ĐĂNG NHẬP (Dành cho khách) -->
        <a href="/login.html" class="btn-login-nav" id="btn-login-nav">Đăng Nhập</a>

        <!-- KHU VỰC USER (Dành cho người đã đăng nhập) -->
        <div class="user-dropdown-container" id="userContainer">
            <div class="user-btn" onclick="toggleDropdown(event)">
                <div class="user-avatar" id="userAvatar">U</div>
                <span class="username" id="username-display">User</span>
                <span style="font-size: 10px;">▼</span>
            </div>
            <div class="dropdown-menu" id="userDropdown">
                <a href="/logout?redirect=index" class="dropdown-item danger">
                    🚪 Đăng xuất
                </a>
            </div>
        </div>

        <button class="btn-icon" id="btn-history" onclick="openHistoryModal()" title="Lịch sử quay">📜</button>
        <button class="btn-icon" id="btn-sound" onclick="toggleSound()" title="Bật/Tắt âm thanh">🔊</button>
    </div>
</header>

<div class="container">
    <div class="carousel-wrapper">
        <button class="nav-arrow prev" id="arrow-prev" onclick="scrollCarousel(-1)">❮</button>
        <div class="carousel-container" id="carousel"></div>
        <button class="nav-arrow next" id="arrow-next" onclick="scrollCarousel(1)">❯</button>
    </div>

    <div class="action-area">
        <button class="btn-random" id="btn-roll" onclick="startRandomRoll()">
            <span>🎲</span> Bắt Đầu Quay
        </button>
        <div class="status-text" id="status-msg">Nhấn nút hoặc phím <b style="color: var(--accent);">SPACE</b> để quay
        </div>
    </div>
</div>

<!-- MODAL CHI TIẾT -->
<div class="modal-overlay" id="actor-modal" onclick="handleBackdropClick(event)">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-body">
            <div class="modal-avatar"><img id="modal-img" src="" alt="Avatar"></div>
            <div class="modal-info">
                <div class="modal-name" id="modal-name">Tên diễn viên</div>
                <div class="info-row"><span class="info-label">Năm sinh:</span><span class="info-val" id="modal-birth">---</span>
                </div>
                <div class="info-row"><span class="info-label">Tuổi:</span><span class="info-val"
                                                                                 id="modal-age">---</span></div>
                <div class="info-row" style="align-items: flex-start;"><span class="info-label"
                                                                             style="margin-top: 3px;">Code nổi bật:</span>
                    <div class="codes-wrapper" id="modal-codes-container"></div>
                </div>
            </div>
        </div>
        <div class="modal-footer"><a href="#" target="_blank" class="btn-visit" id="modal-link">🌐 Xem Profile ↗</a>
        </div>
    </div>
</div>

<!-- MODAL LỊCH SỬ -->
<div class="modal-overlay" id="history-modal" onclick="handleHistoryBackdropClick(event)">
    <div class="modal-content" style="max-width: 400px;">
        <button class="modal-close" onclick="closeHistoryModal()">✕</button>
        <div class="modal-body" style="flex-direction: column; align-items: stretch; padding: 20px;">
            <div class="modal-name" style="text-align: center; margin-bottom: 15px; border:none;">📜 Lịch sử quay</div>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/actors';
    let masterList = [];
    let displayList = [];
    let isRolling = false;
    let currentUser = null;
    const currentYear = new Date().getFullYear();

    // --- LOGIC USER DROPDOWN ---
    async function loadCurrentUser() {
        const loginBtn = document.getElementById('btn-login-nav');
        const userContainer = document.getElementById('userContainer');

        try {
            const res = await fetch('/api/auth/me');
            if (res.ok) {
                // Đã đăng nhập
                const data = await res.json();
                currentUser = data.username;
                document.getElementById('username-display').innerText = data.username;
                document.getElementById('userAvatar').innerText = data.username.charAt(0).toUpperCase();

                userContainer.style.display = 'inline-block';
                loginBtn.style.display = 'none';
            } else {
                // Chưa đăng nhập (Khách)
                userContainer.style.display = 'none';
                loginBtn.style.display = 'inline-block';
            }
        } catch (e) {
            // Lỗi hoặc chưa đăng nhập
            userContainer.style.display = 'none';
            loginBtn.style.display = 'inline-block';
        }
    }

    function toggleDropdown(event) {
        event.stopPropagation();
        document.getElementById('userDropdown').classList.toggle('active');
    }

    // Click ra ngoài để đóng dropdown
    document.addEventListener('click', function (event) {
        const container = document.getElementById('userContainer');
        const dropdown = document.getElementById('userDropdown');
        if (container && !container.contains(event.target)) {
            dropdown.classList.remove('active');
        }
    });

    // ÂM THANH
    let soundEnabled = true, audioCtx = null;

    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playTick() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } catch (e) {
        }
    }

    function playWin() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
                gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.4);
                osc.start(ctx.currentTime + i * 0.12);
                osc.stop(ctx.currentTime + i * 0.12 + 0.5);
            });
        } catch (e) {
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
        document.getElementById('btn-sound').classList.toggle('muted', !soundEnabled);
        if (soundEnabled) playTick();
    }

    // CONFETTI
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [], confettiAnimating = false;

    function resizeConfettiCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeConfettiCanvas);
    resizeConfettiCanvas();

    function launchConfetti() {
        const colors = ['#ff3366', '#ff5c85', '#ffffff', '#888888'];
        for (let side = 0; side < 2; side++) {
            const originX = side === 0 ? 0 : confettiCanvas.width;
            const directionX = side === 0 ? 1 : -1;
            for (let i = 0; i < 80; i++) {
                confettiParticles.push({
                    x: originX,
                    y: confettiCanvas.height * 0.6,
                    vx: directionX * (3 + Math.random() * 4),
                    vy: -8 - Math.random() * 6,
                    size: 6 + Math.random() * 6,
                    color: colors[i % 4],
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.3,
                    life: 1.0,
                    shape: Math.random() > 0.5 ? 'rect' : 'circle'
                });
            }
        }
        if (!confettiAnimating) {
            confettiAnimating = true;
            requestAnimationFrame(updateConfetti);
        }
    }

    function updateConfetti() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiParticles.forEach(p => {
            p.vy += 0.25;
            p.vx *= 0.99;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            p.life -= 0.008;
            confettiCtx.save();
            confettiCtx.globalAlpha = Math.max(0, p.life);
            confettiCtx.translate(p.x, p.y);
            confettiCtx.rotate(p.rotation);
            confettiCtx.fillStyle = p.color;
            if (p.shape === 'rect') confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); else {
                confettiCtx.beginPath();
                confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                confettiCtx.fill();
            }
            confettiCtx.restore();
        });
        confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < confettiCanvas.height + 50);
        if (confettiParticles.length > 0) requestAnimationFrame(updateConfetti); else {
            confettiAnimating = false;
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
    }

    // TẢI VÀ RENDER DỮ LIỆU
    async function loadActors() {
        showSkeleton(6);
        try {
            const res = await fetch(API_URL);
            masterList = await res.json();
            displayList = [...masterList];
            renderActors();
            hideSkeleton();
        } catch (err) {
            console.error("Lỗi:", err);
            document.getElementById('carousel').innerHTML = '<div style="color:red; padding:20px;">Lỗi kết nối máy chủ!</div>';
            hideSkeleton();
        }
    }

    function renderActors() {
        const carousel = document.getElementById('carousel');
        carousel.innerHTML = '';
        if (displayList.length === 0) {
            carousel.innerHTML = '<div style="color: var(--text-sub); padding: 40px; margin: auto;">Không tìm thấy diễn viên nào.</div>';
            document.getElementById('btn-roll').disabled = true;
            checkOverflow();
            return;
        }
        document.getElementById('btn-roll').disabled = false;
        let cardsHtml = '';
        const fallbackImg = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';

        displayList.forEach((actor) => {
            const calculatedAge = actor.age != null ? `${actor.age} tuổi` : (actor.birthYear ? `${currentYear - actor.birthYear} tuổi` : '---');
            cardsHtml += `
                <div class="card" id="card-${actor.id}" onclick="openModal('${actor.id}')">
                    <div class="card-thumbnail">
                        <img src="${actor.imageUrl || fallbackImg}" alt="${actor.name}" onerror="this.src='${fallbackImg}'">
                        <span class="card-badge">${calculatedAge}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-name" title="${actor.name}">${actor.name}</div>
                        <div class="card-role">Diễn viên</div>
                    </div>
                </div>
            `;
        });
        carousel.innerHTML = cardsHtml;
        checkOverflow();
        setTimeout(() => centerCarousel(), 60);
    }

    function handleSearch(keyword) {
        if (isRolling) return;
        const lowerKw = keyword.toLowerCase().trim();
        if (!lowerKw) {
            displayList = [...masterList];
        } else {
            displayList = masterList.filter(a => a.name.toLowerCase().includes(lowerKw));
        }
        renderActors();
    }

    function showSkeleton(count) {
        const carousel = document.getElementById('carousel');
        carousel.innerHTML = '';
        for (let i = 0; i < count; i++) {
            carousel.innerHTML += `<div class="skeleton-card"><div class="skeleton-thumbnail"></div><div class="skeleton-info"><div class="skeleton-line name"></div><div class="skeleton-line role"></div></div></div>`;
        }
        document.getElementById('btn-roll').disabled = true;
        document.getElementById('status-msg').innerText = 'Đang tải...';
    }

    function hideSkeleton() {
        document.getElementById('btn-roll').disabled = false;
        document.getElementById('status-msg').innerHTML = 'Nhấn nút hoặc phím <b style="color: var(--accent);">SPACE</b> để quay';
    }

    function checkOverflow() {
        const c = document.getElementById('carousel');
        const p = document.getElementById('arrow-prev'), n = document.getElementById('arrow-next');
        if (c.scrollWidth > c.clientWidth) {
            c.classList.add('has-overflow');
            p.style.display = 'flex';
            n.style.display = 'flex';
        } else {
            c.classList.remove('has-overflow');
            p.style.display = 'none';
            n.style.display = 'none';
        }
    }

    function scrollCarousel(dir) {
        document.getElementById('carousel').scrollBy({
            left: dir * document.getElementById('carousel').clientWidth * 0.8,
            behavior: 'smooth'
        });
    }

    function centerCarousel() {
        const c = document.getElementById('carousel');
        c.scrollTo({left: Math.max(0, (c.scrollWidth - c.clientWidth) / 2), behavior: 'instant'});
    }

    function centerCard(card, behavior) {
        const c = document.getElementById('carousel');
        const cRect = c.getBoundingClientRect();
        const rect = card.getBoundingClientRect();
        const left = c.scrollLeft + (rect.left - cRect.left) - (c.clientWidth - rect.width) / 2;
        c.scrollTo({left: Math.max(0, left), behavior});
    }

    // MODAL CHI TIẾT
    function openModal(id) {
        if (isRolling) return;
        const actor = masterList.find(a => String(a.id) === String(id));
        if (!actor) return;
        document.getElementById('modal-img').src = actor.imageUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80';
        document.getElementById('modal-name').innerText = actor.name;
        document.getElementById('modal-birth').innerText = actor.birthYear || 'Chưa cập nhật';
        document.getElementById('modal-age').innerText = actor.age ? actor.age + ' tuổi' : 'Chưa rõ';
        const codes = document.getElementById('modal-codes-container');
        codes.innerHTML = actor.famousCode ? actor.famousCode.split(',').map(c => `<span class="code-tag">${c.trim()}</span>`).join('') : 'Chưa cập nhật';
        document.getElementById('modal-link').href = actor.webUrl || `https://google.com/search?q=${actor.name}`;
        document.getElementById('actor-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('actor-modal').classList.remove('active');
    }

    function handleBackdropClick(e) {
        if (e.target.id === 'actor-modal') closeModal();
    }

    // LỊCH SỬ QUAY
    async function saveHistory(actor) {
        if (!currentUser) return; // Không lưu nếu chưa đăng nhập
        try {
            await fetch('/api/history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actorName: actor.name, actorImageUrl: actor.imageUrl })
            });
        } catch (e) {
            console.error("Lỗi lưu lịch sử:", e);
        }
    }

    async function openHistoryModal() {
        const historyList = document.getElementById('history-list');
        document.getElementById('history-modal').classList.add('active');

        if (!currentUser) {
            historyList.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding: 20px;">Vui lòng đăng nhập để xem lịch sử quay!</div>';
            return;
        }

        historyList.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding: 20px;">Đang tải dữ liệu...</div>';

        try {
            const res = await fetch('/api/history');
            if (res.ok) {
                const history = await res.json();
                if (history.length === 0) {
                    historyList.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding: 20px;">Chưa có lịch sử quay.</div>';
                } else {
                    const fallbackImg = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80';

                    historyList.innerHTML = history.map(item => {
                        let timeStr = "Không xác định";

                        if (item.spinTime) {
                            // 1. Xử lý chuỗi: Cắt bỏ phần [Asia/Ho_Chi_Minh] nếu có
                            let rawDate = item.spinTime;
                            if (typeof rawDate === 'string' && rawDate.includes('[')) {
                                rawDate = rawDate.split('[')[0];
                            }

                            // 2. Tạo đối tượng Date
                            const date = new Date(rawDate);

                            // 3. Kiểm tra xem Date có hợp lệ không (tránh lỗi Invalid Date)
                            if (!isNaN(date.getTime())) {
                                timeStr = date.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'}) + ' - ' + date.toLocaleDateString('vi-VN');
                            }
                        }

                        return `
                        <div class="history-item">
                            <img src="${item.actorImageUrl || fallbackImg}" alt="${item.actorName}">
                            <div class="history-info">
                                <div class="history-name">${item.actorName}</div>
                                <div class="history-time">${timeStr}</div>
                            </div>
                        </div>`;
                    }).join('');
                }
            } else {
                historyList.innerHTML = '<div style="text-align:center; color:var(--danger); padding: 20px;">Lỗi khi tải lịch sử!</div>';
            }
        } catch (err) {
            historyList.innerHTML = '<div style="text-align:center; color:var(--danger); padding: 20px;">Lỗi kết nối máy chủ!</div>';
        }
    }

    function closeHistoryModal() {
        document.getElementById('history-modal').classList.remove('active');
    }

    function handleHistoryBackdropClick(e) {
        if (e.target.id === 'history-modal') closeHistoryModal();
    }

    // QUAY RANDOM
    async function startRandomRoll() {
        if (isRolling || displayList.length === 0) return;
        closeModal();
        closeHistoryModal();
        isRolling = true;
        document.body.classList.add('is-rolling');
        const rollBtn = document.getElementById('btn-roll');
        const statusMsg = document.getElementById('status-msg');
        rollBtn.disabled = true;
        statusMsg.innerText = "Đang quay ngẫu nhiên...";
        document.querySelectorAll('.card').forEach(c => c.classList.remove('winner', 'active-roll'));

        let winnerIndex = -1;
        const isSearching = document.getElementById('search-input').value.trim() !== '';
        if (!isSearching) {
            try {
                const res = await fetch(`${API_URL}/random`);
                if (res.ok && res.status !== 204) {
                    const winnerData = await res.json();
                    winnerIndex = displayList.findIndex(a => String(a.id) === String(winnerData.id));
                }
            } catch (e) {
            }
        }
        if (winnerIndex === -1) {
            winnerIndex = Math.floor(Math.random() * displayList.length);
        }

        const n = displayList.length;
        let totalSteps, startIndex;
        if (n <= 12) {
            const fullRounds = n > 5 ? 4 : 6;
            totalSteps = (fullRounds * n) + winnerIndex;
            startIndex = 0;
        } else {
            totalSteps = 48;
            startIndex = (((winnerIndex - totalSteps) % n) + n) % n;
        }
        let currentStep = 0;
        let currentIndex = startIndex;
        let speed = 40;

        function rollStep() {
            const prevCard = document.querySelector('.card.active-roll');
            if (prevCard) prevCard.classList.remove('active-roll');
            const currentActor = displayList[currentIndex];
            const activeCard = document.getElementById(`card-${currentActor.id}`);
            const remainingSteps = totalSteps - currentStep;
            if (activeCard) {
                if (remainingSteps <= 10) {
                    activeCard.classList.add('active-roll');
                    playTick();
                }
                centerCard(activeCard, 'instant');
            }
            currentStep++;
            if (currentStep > totalSteps) {
                setTimeout(() => {
                    const finalActor = displayList[winnerIndex];
                    const finalCard = document.getElementById(`card-${finalActor.id}`);
                    if (finalCard) {
                        finalCard.classList.remove('active-roll');
                        finalCard.classList.add('winner');
                        centerCard(finalCard, 'smooth');
                    }
                    statusMsg.innerHTML = `Chúc mừng! Diễn viên được chọn: <b style="color: var(--accent); font-size: 16px;">${finalActor.name}</b>`;
                    rollBtn.disabled = false;
                    isRolling = false;
                    document.body.classList.remove('is-rolling');
                    saveHistory(finalActor);
                    playWin();
                    launchConfetti();
                }, 220);
                return;
            }
            if (remainingSteps < 4) speed += 90; else if (remainingSteps < 8) speed += 45; else if (remainingSteps < 15) speed += 20;
            currentIndex = (currentIndex + 1) % n;
            setTimeout(rollStep, speed);
        }

        rollStep();
    }

    // KHỞI CHẠY
    loadCurrentUser();
    loadActors();

    document.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if ((e.code === 'Space' || e.code === 'Enter') && !isRolling) {
            e.preventDefault();
            startRandomRoll();
        }
    });
</script>
</body>
</html>
